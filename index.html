<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>아빠와 아들, 캘리포니아 9일</title>
<meta name="theme-color" content="#2C5B49">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="미국여행">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --granite:#E7E8E3; --paper:#fff; --ink:#1B241F; --soft:#616B64; --faint:#8C958E;
  --line:#D2D5CD; --pine:#2C5B49; --gg:#C0362C; --gold:#9A6E12; --steel:#3B5A86;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --disp:"Gothic A1","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --pad:18px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--granite);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:40px}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}
a{color:var(--pine)}
button{font-family:inherit}
:focus-visible{outline:2.5px solid var(--gg);outline-offset:2px}

/* ---------- role gate ---------- */
.gate{position:fixed;inset:0;z-index:80;background:var(--pine);color:#F2F3EE;
  display:flex;flex-direction:column;justify-content:center;padding:26px;overflow-y:auto}
.gate[hidden]{display:none}
.gate h1{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1.12;margin:0 0 6px}
.gate p{color:#BFCDC5;font-size:14px;margin:0 0 26px}
.gate .pick{display:grid;gap:12px;max-width:420px}
.gate button{background:#F2F3EE;border:0;border-radius:4px;padding:18px 20px;text-align:left;cursor:pointer;color:var(--ink)}
.gate button b{font-family:var(--disp);font-weight:800;font-size:20px;display:block}
.gate button span{font-size:13px;color:var(--soft)}

/* ---------- masthead ---------- */
.mast{background:var(--pine);color:#F2F3EE;padding:20px 0 18px}
.mast h1{font-family:var(--disp);font-weight:900;font-size:clamp(25px,7vw,38px);
  line-height:1.08;letter-spacing:-.018em;margin:0}
.mast .sub{margin:7px 0 0;font-size:13px;color:#BFCDC5}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}
.stamp{display:inline-flex;align-items:baseline;gap:7px;background:var(--gg);color:#fff;
  border-radius:2px;padding:4px 10px 5px;font-family:var(--disp);font-weight:800;font-size:13px}
.stamp b{font-size:17px;line-height:1}
.stamp:empty{display:none}
.who{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#F2F3EE;
  border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.sync{font-size:11.5px;color:#9FB3A9;margin:8px 0 0}

/* ---------- tabs ---------- */
.tabbar{position:sticky;top:0;z-index:30;background:var(--granite);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 var(--pad);max-width:760px;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;
  padding:13px 11px 10px;font-size:14.5px;font-weight:600;color:var(--soft);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--gg)}

/* ---------- spine ---------- */
.spine{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  margin:0 calc(-1*var(--pad));padding:2px var(--pad) 6px}
.spine::-webkit-scrollbar{display:none}
.spine button{flex:0 0 auto;width:60px;background:var(--paper);border:1px solid var(--line);
  border-top:4px solid var(--rc,var(--soft));border-radius:3px;padding:7px 4px 8px;cursor:pointer;text-align:center;color:var(--ink)}
.spine .wd{font-size:11px;color:var(--faint)}
.spine .dd{font-family:var(--disp);font-weight:800;font-size:16px;line-height:1.2;display:block}
.spine .rg{font-size:9.5px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.spine button[aria-current=true]{background:var(--pine);border-color:var(--pine);color:#fff}
.spine button[aria-current=true] .wd,.spine button[aria-current=true] .rg{color:#C3D2CA}
.spine button.today{box-shadow:inset 0 0 0 2px var(--gg)}

/* ---------- blocks ---------- */
section{padding:20px 0 10px}
h2{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:26px 0 10px}
h2:first-of-type{margin-top:4px}
h3.sub{font-family:var(--disp);font-weight:800;font-size:17px;margin:22px 0 8px}
.lede{color:var(--soft);font-size:13.5px;margin:-4px 0 14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:15px 16px;margin-bottom:10px}
.card.flag{border-left:4px solid var(--gg)}
.card h3{font-family:var(--disp);font-weight:800;font-size:16.5px;margin:0 0 8px}
.kind{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:2px;background:#EDEFE9;color:var(--soft);margin-right:6px}
.kind.pine{background:#E4EDE8;color:var(--pine)}
.kind.gg{background:#F7E7E4;color:var(--gg)}
.kind.gold{background:#F4EDDC;color:var(--gold)}
.kind.steel{background:#E6EBF3;color:var(--steel)}

.hero{background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--gg);border-radius:4px;padding:18px;margin-bottom:12px}
.hero .date{font-family:var(--disp);font-weight:900;font-size:26px;letter-spacing:-.02em;margin:0}
.hero .head{color:var(--soft);font-size:13px;margin:0 0 4px}
.keys{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.keys li{border-bottom:1px solid var(--line);padding:11px 0 11px 30px;position:relative;font-size:16px;font-weight:600;line-height:1.4}
.keys li span{position:absolute;left:0;top:11px;font-family:var(--disp);font-weight:800;color:var(--gg)}
.quote{margin:14px 0 0;font-family:var(--disp);font-weight:700;font-size:15px;color:var(--pine)}

.dl{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:14px;margin:0}
.dl dt{color:var(--faint);font-size:12.5px;padding-top:2px}
.dl dd{margin:0}
.dl dd.b{color:var(--gg)}

.tl{position:relative;margin:0;padding:0 0 0 68px;list-style:none}
.tl:before{content:"";position:absolute;left:58px;top:8px;bottom:14px;width:1px;background:var(--line)}
.tl li{position:relative;margin-bottom:12px}
.tl .t{position:absolute;left:-68px;width:58px;text-align:right;font-size:11.5px;color:var(--soft);line-height:1.35;padding-top:14px}
.tl li:before{content:"";position:absolute;left:-14px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--pine);border:2px solid var(--granite)}
.tl .card{margin:0}
.tl h3{font-size:15.5px;margin-bottom:9px;font-weight:700;font-family:var(--sans);line-height:1.4}

.chk{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.chk label{display:grid;grid-template-columns:22px 1fr;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.chk label:last-child{border-bottom:0}
.chk input{width:19px;height:19px;margin:2px 0 0;accent-color:var(--pine)}
.chk .it{font-size:14.5px;font-weight:500;line-height:1.4}
.chk .mt{font-size:12.5px;color:var(--soft);margin-top:2px;display:block}
.chk .due{font-size:11.5px;color:var(--gg);font-weight:600}
.chk input:checked ~ .tx .it{color:var(--faint);text-decoration:line-through}
.bar{height:6px;background:#DADCD5;border-radius:3px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--pine);transition:width .3s}
.barlab{font-size:12.5px;color:var(--soft);margin-bottom:14px}
.lnk{display:inline-block;margin-top:5px;font-size:12.5px;font-weight:600;color:var(--pine)}

details.spot{background:var(--paper);border:1px solid var(--line);border-radius:4px;margin-bottom:8px}
details.spot summary{padding:13px 15px;cursor:pointer;font-family:var(--disp);font-weight:800;font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
details.spot summary::-webkit-details-marker{display:none}
details.spot summary:after{content:"＋";color:var(--faint);font-weight:400}
details.spot[open] summary:after{content:"－"}
details.spot .body{padding:0 15px 15px}

/* ---------- missions ---------- */
.mis{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:0;margin-bottom:10px;overflow:hidden}
.mis label{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.mis label:last-child{border-bottom:0}
.mis input{width:21px;height:21px;margin:1px 0 0;accent-color:var(--gg)}
.mis .mtx{font-size:15px;font-weight:600;line-height:1.45}
.mis input:checked ~ div .mtx{color:var(--faint);text-decoration:line-through}
.mis .say{display:block;margin-top:6px;background:#F7F3E8;border-left:3px solid var(--gold);
  padding:7px 10px;font-size:14px;font-weight:600;color:#4A3C14;border-radius:0 3px 3px 0}
.mis .tagline{display:block;margin-top:5px;font-size:12px;color:var(--faint)}
.stamps{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 16px}
.stamps i{width:26px;height:26px;border:1px solid var(--line);border-radius:3px;background:var(--paper);
  display:grid;place-items:center;font-size:12px;color:var(--faint);font-style:normal}
.stamps i.on{background:var(--gg);border-color:var(--gg);color:#fff;font-weight:700}
.scoreboard{background:var(--pine);color:#fff;border-radius:4px;padding:16px 18px;margin-bottom:14px}
.scoreboard .big{font-family:var(--disp);font-weight:900;font-size:34px;line-height:1}
.scoreboard .cap{color:#BFCDC5;font-size:13px;margin-top:4px}

/* ---------- burger ---------- */
.bg{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 15px;margin-bottom:10px}
.bg .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bg h3{margin:0;font-family:var(--disp);font-weight:800;font-size:17px}
.bg .menu{font-size:12.5px;color:var(--soft);margin:2px 0 12px}
.score{display:grid;grid-template-columns:44px 1fr 1fr 54px;gap:8px;align-items:center;margin-bottom:7px;font-size:13px}
.score .who2{color:var(--soft);font-weight:600}
.score input[type=number]{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:3px;font-size:15px;font-family:inherit;text-align:center;background:#FBFBF9}
.score input[readonly]{background:#F0F1EC;color:var(--soft)}
.score .tot{text-align:right;font-family:var(--disp);font-weight:800;font-size:17px}
.score .ph{font-size:10.5px;color:var(--faint);text-align:center}
.score.mine input[type=number]{border-color:#B9BEB4;box-shadow:inset 0 0 0 1px #fff}
.note{width:100%;margin-top:8px;padding:8px 9px;border:1px solid var(--line);border-radius:3px;font-family:inherit;font-size:13.5px;background:#FBFBF9}
.champ{background:var(--pine);color:#fff;border-radius:4px;padding:16px 18px;margin-bottom:14px}
.champ .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.18);padding:8px 0;font-size:14px}
.champ .row:last-child{border:0}
.champ b{font-family:var(--disp);font-weight:800;font-size:16px}
.champ .empty{color:#BFCDC5;font-size:13.5px}

/* ---------- log ---------- */
.log{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 15px;margin-bottom:10px}
.log .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.log .d{font-family:var(--disp);font-weight:800;font-size:16px}
.log .slot{margin-bottom:9px}
.log .lab{font-size:11.5px;color:var(--faint);margin-bottom:3px}
.log textarea{width:100%;min-height:54px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;
  font-family:inherit;font-size:14px;line-height:1.5;background:#FBFBF9;resize:vertical}
.log textarea[readonly]{background:#F0F1EC;color:var(--soft)}
.log .said{background:#F0F1EC;border-radius:3px;padding:9px 10px;font-size:14px;color:var(--ink);white-space:pre-wrap}
.log .none{color:var(--faint);font-size:13px}

.ph-card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:13px 15px;margin-bottom:8px}
.ph-card .en{font-size:15.5px;font-weight:600;line-height:1.45;margin:0}
.ph-card .ko{font-size:13.5px;color:var(--soft);margin:4px 0 0}
.ph-card .tip{font-size:12.5px;color:var(--pine);margin:6px 0 0}
.mission{display:inline-block;margin-top:8px;background:#F4EDDC;color:var(--gold);font-size:12px;font-weight:600;padding:3px 8px;border-radius:2px}
.tip-card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:13px 15px;margin-bottom:8px}
.tip-card .hd{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.tip-card .pt{font-weight:600;font-size:14.5px;line-height:1.4;margin:0 0 6px}
.foot{color:var(--faint);font-size:12px;text-align:center;padding:26px 0 10px;line-height:1.6}
.mini{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:8px 15px;
  font-size:13px;font-weight:600;color:var(--pine);cursor:pointer;margin:0 6px 10px 0}
.io{width:100%;min-height:74px;padding:9px 10px;margin:0 0 9px;border:1px solid var(--line);
  border-radius:3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
  line-height:1.45;background:#FBFBF9;resize:vertical;word-break:break-all}

/* ---------- 지출 ---------- */
.sum{background:var(--pine);color:#fff;border-radius:4px;padding:16px 18px;margin-bottom:12px}
.sum .big{font-family:var(--disp);font-weight:900;font-size:32px;line-height:1.05}
.sum .cap{color:#BFCDC5;font-size:12.5px;margin-top:5px}
.sum .krw{font-size:15px;color:#DCE5E0;margin-top:2px}
.form{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:14px 15px;margin-bottom:14px}
.form .row{display:grid;gap:8px;margin-bottom:9px}
.form .row.two{grid-template-columns:1fr 84px}
.form label.lab{display:block;font-size:11.5px;color:var(--faint);margin:0 0 4px}
.form input[type=text],.form input[type=number],.form select,.form textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:3px;
  font-family:inherit;font-size:15px;background:#FBFBF9;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:#F2F3EE;border:1px solid var(--line);border-radius:16px;padding:7px 12px;
  font-size:13px;font-weight:500;color:var(--soft);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}
.shotpick{display:flex;align-items:center;gap:10px;margin:2px 0 10px}
.shotpick label{background:var(--paper);border:1px dashed var(--soft);border-radius:3px;padding:10px 14px;
  font-size:13.5px;font-weight:600;color:var(--pine);cursor:pointer}
.shotpick input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.shotpick img{width:52px;height:52px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.shotpick .st{font-size:12px;color:var(--soft)}
.btn{background:var(--gg);color:#fff;border:0;border-radius:3px;padding:12px 18px;
  font-family:var(--disp);font-weight:800;font-size:15px;cursor:pointer;width:100%}
.exp{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:8px;
  display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:start}
.exp .th{width:54px;height:54px;border-radius:3px;border:1px solid var(--line);object-fit:cover;background:#F2F3EE;cursor:zoom-in}
.exp .noth{width:54px;height:54px;border-radius:3px;border:1px dashed var(--line);display:grid;place-items:center;
  font-size:10.5px;color:var(--faint);text-align:center;line-height:1.3}
.exp .amt{font-family:var(--disp);font-weight:800;font-size:16px;white-space:nowrap}
.exp .meta{font-size:12.5px;color:var(--soft);margin-top:3px;line-height:1.45}
.exp .del{background:none;border:0;color:var(--faint);font-size:12.5px;cursor:pointer;padding:2px 0 0}
.catbar{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:13px 15px;margin-bottom:10px}
.catbar .ln{display:grid;grid-template-columns:1fr 62px;gap:10px;align-items:center;margin-bottom:7px;font-size:13.5px}
.catbar .ln:last-child{margin-bottom:0}
.catbar .tr{height:7px;background:#E7E8E3;border-radius:4px;overflow:hidden;margin-top:4px}
.catbar .tr i{display:block;height:100%;background:var(--pine)}
.catbar .v{text-align:right;font-family:var(--disp);font-weight:800;font-size:14px}
.lightbox{position:fixed;inset:0;z-index:90;background:rgba(20,24,21,.94);display:grid;place-items:center;padding:14px}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:82vh;border-radius:3px}
.lightbox .cls{position:absolute;top:16px;right:16px;background:#fff;border:0;border-radius:20px;
  padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important}
  #printArea{font-family:var(--sans);color:#000}
  #printArea h1{font-size:18pt;margin:0 0 4pt}
  #printArea .sub{font-size:9pt;color:#444;margin:0 0 12pt}
  #printArea table{width:100%;border-collapse:collapse;font-size:9pt}
  #printArea th,#printArea td{border-bottom:.5pt solid #999;padding:4pt 3pt;text-align:left;vertical-align:top}
  #printArea td.n{text-align:right;white-space:nowrap}
  #printArea .shots{margin-top:14pt;display:grid;grid-template-columns:1fr 1fr;gap:8pt}
  #printArea .shots figure{margin:0;break-inside:avoid}
  #printArea .shots img{width:100%;border:.5pt solid #bbb}
  #printArea .shots figcaption{font-size:7.5pt;color:#333;margin-top:2pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(min-width:620px){.dl{grid-template-columns:84px 1fr 84px 1fr}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <h1>아빠와 아들,<br>캘리포니아 9일</h1>
  <p>이 폰은 누가 쓰나요? 보이는 화면이 달라집니다.<br>나중에 상단 배지를 눌러 바꿀 수 있습니다.</p>
  <div class="pick">
    <button data-role="dad"><b>아빠</b><span>일정·예약·렌터카·준비 체크까지 전부</span></button>
    <button data-role="son"><b>아들</b><span>오늘 미션·버거 심사·기록 중심</span></button>
  </div>
</div>

<header class="mast">
  <div class="wrap">
    <div class="toprow">
      <div class="stamp" id="stamp"></div>
      <button class="who" id="whoBtn"></button>
    </div>
    <h1>아빠와 아들,<br>캘리포니아 9일</h1>
    <p class="sub">2026.9.18 금 – 9.26 토 · 샌프란시스코 · 요세미티 · 실리콘밸리</p>
    <p class="sync" id="sync"></p>
  </div>
</header>

<div class="tabbar"><div class="tabs" id="tabs" role="tablist"></div></div>
<div class="wrap" id="views"></div>
<p class="foot" id="foot"></p>
<div class="lightbox" id="lightbox" hidden><button class="cls" id="lbClose">닫기</button><img id="lbImg" alt="영수증"></div>
<div id="printArea"></div>

<script>
const DATA = {
 "schedule": [
  {
   "day": "9/18",
   "time": "오후",
   "title": "ICN → SFO / 입국·수하물",
   "move": "항공 + 호텔 셔틀",
   "dist": "-",

/* 받은 기록 합치기 — 항목별로 나중에 쓴 값이 남습니다 */
function mergeKV(other){
  let n=0;
  Object.keys(other||{}).forEach(p=>{
    const r=other[p];
    if(!r||typeof r.t!=='number') return;
    const l=KV[p];
    if(!l||r.t>l.t){KV[p]=r;n++;}
  });
  if(n) saveLocalNow();
  return n;
}

function usd(e){ return e.cur==='USD'?Number(e.amt)||0:(rate()?(Number(e.amt)||0)/rate():0); }
function krw(e){ return e.cur==='KRW'?Number(e.amt)||0:(Number(e.amt)||0)*rate(); }

/* 사진 저장소 (IndexedDB) — 용량이 큰 사진은 여기 둡니다 */
let _db=null;
function idb(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    if(typeof indexedDB==='undefined') return rej(new Error('no-idb'));
    const rq=indexedDB.open('trip2026',1);
    rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains('shots'))db.createObjectStore('shots');};
    rq.onsuccess=()=>{_db=rq.result;res(_db);};
    rq.onerror=()=>rej(rq.error);
  });
}
function shotOp(mode,fn){
  return idb().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('shots',mode), st=t.objectStore('shots'), r=fn(st);
    t.oncomplete=()=>res(r&&'result' in r?r.result:null);
    t.onerror=()=>rej(t.error);
  }));
}
const shotPut=(id,blob)=>shotOp('readwrite',st=>st.put(blob,id));
const shotGet=id=>shotOp('readonly',st=>st.get(id));
const shotDel=id=>shotOp('readwrite',st=>st.delete(id));

/* 사진을 1400px·JPEG로 줄여 저장합니다. 원본은 폰 사진앱에 그대로 남습니다 */
function compress(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const sc=Math.min(1,1400/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*sc));
      c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('변환 실패')),'image/jpeg',0.68);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('읽기 실패'));};
    img.src=url;
  });
}

/* 목록·인쇄에 쓸 사진을 IndexedDB에서 꺼내 붙입니다 */
function hydrateShots(root){
  SHOT_URLS.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}});
  SHOT_URLS=[];
  const nodes=(root||document).querySelectorAll('[data-shot]');
  nodes.forEach(el=>{
    shotGet(el.getAttribute('data-shot')).then(b=>{
      if(!b) return;
      const u=URL.createObjectURL(b); SHOT_URLS.push(u); el.src=u;
    }).catch(()=>{});
  });
}

async function saveExpense(){
  const amt=(document.getElementById('fAmt')||{}).value;
  const memo=(document.getElementById('fMemo')||{}).value||'';
  if(!amt||isNaN(Number(amt))||Number(amt)<=0){
    const st=document.getElementById('shotSt'); if(st) st.textContent='금액을 먼저 넣어주세요.';
    return;
  }
  const id=String(Date.now()).slice(-8)+Math.random().toString(36).slice(2,5);
  let hasImg=false;
  if(PENDING){
    try{ await shotPut(id,PENDING.blob); hasImg=true; }catch(e){ hasImg=false; }
    try{ URL.revokeObjectURL(PENDING.url); }catch(e){}
    PENDING=null;
  }
  sv('exp/'+id,{day:FORM.day,amt:Number(amt),cur:FORM.cur,cat:FORM.cat,pay:FORM.pay,
                who:FORM.who,memo:memo,img:hasImg,ts:Date.now()});
  FORM.amt=''; FORM.memo='';
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  render();
}

function renderChamp(){
  const box=document.getElementById('champ'); if(!box) return;
  const sum=(s,who)=>(Number(s[who+'P'])||0)+(Number(s[who+'F'])||0);
  const scored=DATA.burger.map((b,i)=>({b,s:scoreOf(i)}))
    .filter(x=>Object.values(x.s).some(v=>v!==''&&v!=null));
  if(!scored.length){
    box.innerHTML=`<div class="champ"><p class="empty" style="margin:0">점수를 넣으면 아빠 PICK · 아들 PICK · 부자 CHAMPION이 여기에 나옵니다.</p></div>`;
    return;
  }
  const best=w=>scored.slice().sort((a,b)=>sum(b.s,w)-sum(a.s,w))[0];
  const dad=best('dad'), son=best('son');
  const tot=scored.slice().sort((a,b)=>(sum(b.s,'dad')+sum(b.s,'son'))-(sum(a.s,'dad')+sum(a.s,'son')))[0];
  box.innerHTML=`<div class="champ">
    <div class="row"><span>아빠 PICK</span><b>${esc(dad.b.brand)} · ${sum(dad.s,'dad')}</b></div>
    <div class="row"><span>아들 PICK</span><b>${esc(son.b.brand)} · ${sum(son.s,'son')}</b></div>
    <div class="row"><span>부자여행 CHAMPION</span><b>${esc(tot.b.brand)} · ${sum(tot.s,'dad')+sum(tot.s,'son')}</b></div></div>`;
}
function renderTotals(){

      el.textContent=any?((Number(s[w+'P'])||0)+(Number(s[w+'F'])||0)):'–';
      el.style.color=any?'var(--ink)':'var(--faint)';

  });
  renderChamp();
}

    <div class="ph-card"><p class="en">${esc(p.en)}</p><p class="ko">${esc(p.ko)}</p>

    ${p.mission?`<span class="mission">아들 미션 · ${esc(p.mission)}</span>`:''}</div>`).join('')).join('');
  return html;
}

/* ---------- shell ---------- */
const TABS_DAD=[['today','오늘',viewTodayDad],['sched','일정',viewSched],['book','예약',viewBooking],
  ['spot','스팟',viewSpots],['food','먹기',viewFood],['burger','버거',viewBurger],['shop','쇼핑',viewShop],
  ['exp','비용',viewExpense],['live','LIVE',viewLive],['drive','운전',viewDrive],['prep','준비',viewPrep],['talk','회화',viewTalk],
  ['log','기록',viewLog],['mis','미션',viewMission]];
const TABS_SON=[['today','오늘',viewTodaySon],['mis','미션',viewMission],['sched','일정',viewSched],
  ['burger','버거',viewBurger],['exp','비용',viewExpense],['talk','회화',viewTalk],
  ['spot','스팟',viewSpots],['log','기록',viewLog],['prep','내 짐',viewPrepSon]];
const tabSet=()=>isDad()?TABS_DAD:TABS_SON;
let cur='today';

function render(){
  const set=tabSet();
  if(!set.some(t=>t[0]===cur)) cur='today';
  document.getElementById('tabs').innerHTML=set.map(([id,label])=>
    `<button role="tab" data-tab="${id}" aria-selected="${cur===id}">${label}</button>`).join('');
  document.getElementById('views').innerHTML=`<section>${set.find(t=>t[0]===cur)[2]()}</section>`;
  if(cur==='burger') renderTotals();
  if(cur==='exp') hydrateShots(document.getElementById('views'));
  document.getElementById('whoBtn').textContent=meLab()+' 모드 · 바꾸기';
  updateStatus();
  document.getElementById('foot').innerHTML =
    '체크·점수·한마디는 각 폰에 저장됩니다. 두 폰의 기록은 기록 탭에서 합칠 수 있습니다.<br>'
    + '중요 예약번호·렌터카 조건은 오프라인에서도 볼 수 있게 저장했습니다. 최종 계약은 원본 바우처를 우선하세요.';
}
function go(tab){cur=tab;render();window.scrollTo({top:0});}

document.addEventListener('click',e=>{
  const g=e.target.closest('[data-role]');
  if(g){pickRole(g.dataset.role);return;}
  const w=e.target.closest('#whoBtn');
  if(w){const gate=document.getElementById('gate');gate.style.display='';gate.hidden=false;return;}
  const fc=e.target.closest('[data-fcat]'); if(fc){FORM.cat=fc.dataset.fcat;render();return;}
  const fp=e.target.closest('[data-fpay]'); if(fp){FORM.pay=fp.dataset.fpay;render();return;}
  const fw=e.target.closest('[data-fwho]'); if(fw){FORM.who=fw.dataset.fwho;render();return;}
  if(e.target.closest('#expSave')){saveExpense();return;}
  const ed=e.target.closest('[data-expdel]');
  if(ed){
    const id=ed.dataset.expdel;
    sv('exp/'+id,{del:true});      /* 합치기에서 되살아나지 않게 삭제 표시로 남깁니다 */
    shotDel(id).catch(()=>{});
    render(); return;
  }
  const zm=e.target.closest('[data-zoom]');
  if(zm){
    shotGet(zm.dataset.zoom).then(b=>{
      if(!b) return;
      const u=URL.createObjectURL(b); SHOT_URLS.push(u);
      document.getElementById('lbImg').src=u;
      document.getElementById('lightbox').hidden=false;
    }).catch(()=>{});
    return;
  }
  if(e.target.closest('#lbClose')||e.target.id==='lightbox'){
    document.getElementById('lightbox').hidden=true; return;
  }
  if(e.target.closest('#csvBtn')){
    const ta=document.getElementById('csvOut'), msg=document.getElementById('csvMsg');
    ta.hidden=false; ta.value=csvText();
    ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0,ta.value.length);
    let ok=false; try{ ok=document.execCommand('copy'); }catch(err){}
    ta.setAttribute('readonly','');
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>{msg.textContent='복사했습니다. 엑셀에 붙여넣으면 칸이 나뉩니다.';});}
    else msg.textContent=ok?'복사했습니다. 엑셀에 붙여넣으면 칸이 나뉩니다.':'아래 칸을 길게 눌러 복사하세요.';
    return;
  }
  if(e.target.closest('#printBtn')){
    buildPrint();
    const msg=document.getElementById('csvMsg');
    if(msg) msg.textContent='인쇄 화면에서 프린터 대신 PDF로 저장을 고르세요.';
    setTimeout(()=>window.print(),600);
    return;
  }
  const t=e.target.closest('[data-tab]'); if(t){go(t.dataset.tab);return;}
  const d=e.target.closest('[data-goday]'); if(d){schedDay=d.dataset.goday;go('sched');return;}
});
document.addEventListener('change',e=>{
  const fs=e.target.closest('#fShot');
  if(fs){
    const f=fs.files&&fs.files[0]; if(!f) return;
    const st=document.getElementById('shotSt'); if(st) st.textContent='사진 줄이는 중…';
    compress(f).then(b=>{
      if(PENDING){try{URL.revokeObjectURL(PENDING.url);}catch(err){}}
      PENDING={blob:b,url:URL.createObjectURL(b)};
      render();
    }).catch(()=>{ if(st) st.textContent='이 사진을 읽지 못했습니다. 다른 사진으로 해보세요.'; });
    return;
  }
  const cur2=e.target.closest('#fCur'); if(cur2){FORM.cur=cur2.value;return;}
  const dy=e.target.closest('#fDay'); if(dy){FORM.day=dy.value;return;}
  const c=e.target.closest('[data-chk]');
  if(c){sv('chk/'+c.dataset.chk,c.checked);if(['book','prep','shop','today'].includes(cur))render();return;}
  const m=e.target.closest('[data-mis]');
  if(m){sv('mis/'+m.dataset.mis,m.checked);render();}
});
document.addEventListener('input',e=>{
  const fa=e.target.closest('#fAmt'); if(fa){FORM.amt=fa.value;return;}
  const fm=e.target.closest('#fMemo'); if(fm){FORM.memo=fm.value;return;}
  const fr=e.target.closest('#fRate'); if(fr){sv('rate',fr.value);return;}
  const s=e.target.closest('[data-sc]');
  if(s){sv('sc/'+s.dataset.sc+'/'+s.dataset.who+s.dataset.part,
      s.value===''?'':Math.max(0,Math.min(10,Number(s.value))));
    renderTotals();return;}
  const n=e.target.closest('[data-note]'); if(n){sv('note/'+n.dataset.note,n.value);return;}
  const b=e.target.closest('[data-buy]'); if(b){sv('buy/'+b.dataset.buy,b.value);return;}
  const l=e.target.closest('[data-log]');
  if(l){sv('log/'+l.dataset.log+'/'+l.dataset.lw,l.value);}
});

function pickRole(role){
  ME.role=role;
  writeMe();
  const gate=document.getElementById('gate');
  gate.hidden=true; gate.style.display='none';
  render();
  window.scrollTo({top:0});
}
function stamp(){
  const el=document.getElementById('stamp');
  if(dLeft>0) el.innerHTML=`출발까지 <b>D-${dLeft}</b>`;
  else if(todayKey) el.innerHTML=`여행 <b>${dayIndex(todayKey)+1}일차</b> · ${todayKey}`;
  else el.innerHTML='여행 기록';
}
/* 저장·불러오기 동작 */
document.addEventListener('click',e=>{
  if(e.target.closest('#copyBtn')){
    const ta=document.getElementById('ioOut'), msg=document.getElementById('ioMsg');
    ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0,ta.value.length);
    let ok=false;
    try{ ok=document.execCommand('copy'); }catch(err){}
    ta.setAttribute('readonly','');
    if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value).then(()=>{msg.textContent='복사했습니다.';}); }
    else msg.textContent = ok ? '복사했습니다. 상대에게 그대로 보내세요.' : '길게 눌러 전체 선택 후 복사하세요.';
    return;
  }
  if(e.target.closest('#mergeBtn')){
    const inp=document.getElementById('ioIn'), msg=document.getElementById('ioMsg');
    let n=0, bad=false;
    try{ n=mergeKV(JSON.parse(inp.value.trim())); }catch(err){ bad=true; }
    if(bad){ msg.textContent='붙여넣은 내용을 읽을 수 없습니다. 전체를 다시 복사해 주세요.'; return; }
    inp.value='';
    render();
    const m=document.getElementById('ioMsg');
    if(m) m.textContent = n ? n+'개 항목을 합쳤습니다.' : '새로 합칠 내용이 없었습니다.';
    return;
  }
});

(async()=>{
  await loadLocal();
  const r=QS.get('me'); if(r==='dad'||r==='son') ME.role=r;
  stamp();
  if(!ME.role){const gate=document.getElementById('gate');gate.style.display='';gate.hidden=false;ME.role='dad';}
  render();
  /* 한 번 열어두면 통신이 없는 곳에서도 열립니다 */
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
